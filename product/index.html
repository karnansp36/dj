<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Campaign Trigger</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #667eea;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }

    /* Loader */
    #loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      margin: 15px auto;
      animation: spin 1s linear infinite;
    }

    .hidden {
      display: none;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Email Campaign</h2>

    <form id="campaignForm">
      <input type="text" id="name" placeholder="Name" required />
      <input type="email" id="email" placeholder="Email (for single send)" />
      <input type="text" id="course" placeholder="Course (optional)" />

      <!-- 🔥 Action Buttons -->
      <div class="btn-group">
        <button type="submit">Send One</button>
        <button type="button" id="sendLoop">Send 20 (Loop)</button>
        <button type="button" id="sendParallel">Send 20 (Fast)</button>
      </div>
    </form>

    <!-- 🔄 Loader -->
    <div id="loader" class="hidden"></div>

    <!-- 📊 Status -->
    <p id="status"></p>
  </div>

  <!-- Your Script -->
  <script src="script.js"></script>

</body>
</html>
